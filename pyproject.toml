[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litkg"
version = "0.1.0"
description = "Literature -> knowledge graph pipeline: retrieval, entity extraction, Wikidata linking, FAIR RDF output. Topic-agnostic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "semanticClimate" }
]
dependencies = [
    "pygetpapers==1.2.5",
    "spacy==3.7.5",
    "rdflib==7.0.0",
    "PyYAML==6.0.1",
    "pandas==2.2.2",
    "pycountry==24.6.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
litkg = "litkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
